<div class="auth-container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <mat-icon class="logo-icon">sports_soccer</mat-icon>
      <h1 class="logo-text">Crear Cuenta</h1>
      <p class="subtitle">Unite al ecosistema deportivo</p>
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="register()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Nombre completo</mat-label>
        <input matInput type="text" [(ngModel)]="fullName" name="fullName" placeholder="Juan Pérez">
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com">
        <mat-icon matPrefix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" name="password">
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirmar contraseña</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="confirmPassword" name="confirmPassword">
        <mat-icon matPrefix>lock_outline</mat-icon>
      </mat-form-field>

      @if (errorMessage) {
        <p class="error-msg">{{ errorMessage }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="register-btn">
        Continuar
      </button>
    </form>

    <!-- Login Link -->
    <p class="login-link">
      ¿Ya tenés cuenta?
      <a routerLink="/auth/login">Ingresá</a>
    </p>
  </div>
</div>

<div class="auth-container">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-header">
      <mat-icon class="logo-icon">lock_reset</mat-icon>
      <h1 class="logo-text">Sora Sport</h1>
      <p class="subtitle">Recuperá el acceso a tu cuenta</p>
    </div>

    <!-- Forgot Password Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="tu@email.com" autocomplete="email">
        <mat-icon matPrefix>email</mat-icon>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <mat-error>Ingresá un email válido</mat-error>
        }
      </mat-form-field>

      @if (infoMessage) {
        <p class="info-msg">{{ infoMessage }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="isLoading()">
        @if (isLoading()) {
          <mat-progress-spinner mode="indeterminate" diameter="24"></mat-progress-spinner>
        } @else {
          Enviar código
        }
      </button>
    </form>

    <!-- Back to Login Link -->
    <p class="back-link">
      <a routerLink="/auth/login">Volver a iniciar sesión</a>
    </p>
  </div>
</div>
